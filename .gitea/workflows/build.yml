name: Build Docker Nightly image

on:
  push:
    branches:
      - 'main'
  workflow-dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DEFAULT_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          cd src
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:nightly

          # Tag the same image as "latest"
          docker tag ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:nightly ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:latest

      - name: Push Docker Images
        run: |
          docker push ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:nightly
          docker push ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:latest

      - name: Log out from registry
        if: always()
        run: docker logout ${{ vars.DEFAULT_REGISTRY }}

      - name: Cleanup compiled images
        run: |
          docker image rm ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:nightly
          docker image rm ${{ vars.DEFAULT_REGISTRY }}/Vichingo455/pdm-docker:latest