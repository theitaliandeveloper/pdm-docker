name: Build Docker Release image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        default: 'latest'

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: https://github.com/actions/checkout@v4
      
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          cd src
          docker build --build-arg BUILD_IDENTIFIER=${SHORT_HASH:0:5} -t vichingo455/pdm:${{ github.event.inputs.tag }} .
          docker tag vichingo455/pdm:${{ github.event.inputs.tag }} vichingo455/pdm:latest

      - name: Push Docker Images
        run: |
          docker push vichingo455/pdm:${{ github.event.inputs.tag }}
          docker push vichingo455/pdm:latest

      - name: Log out from registry
        if: always()
        run: docker logout

      - name: Cleanup compiled images
        run: |
          docker image rm vichingo455/pdm:latest
          docker image rm vichingo455/pdm:${{ github.event.inputs.tag }}